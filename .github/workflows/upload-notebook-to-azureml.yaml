name: Deploy ML Pipeline to Azure ML

on:
  # push:
  #   branches:
  #     - main-v2
  #     - main
  #   paths:
  #     - 'ML/**'
  #     - 'qmd_dir/supervised.qmd'
  #     - 'qmd_dir/unsupervised.qmd'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy-to-azureml:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Generate Jupyter Notebook from Python Scripts
      run: |
        python .github/scripts/generate_notebook.py

    - name: Install Azure ML SDK
      run: |
        pip install azure-ai-ml azure-identity

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy ML Assets to Azure ML
      run: |
        python .github/scripts/deploy_ml_assets.py
      env:
        AZURE_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
        AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
        AZURE_ML_WORKSPACE: ${{ secrets.AZURE_ML_WORKSPACE }}
