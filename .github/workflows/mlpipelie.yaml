name: Run Azure ML Pipeline

on:
  workflow_dispatch:

jobs:
  run-ml-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check dataset exists
        run: |
          az storage blob exists \
            --account-name taxizonelookup \
            --container-name taxidata \
            --name yellow_tripdata_2025-09.parquet \
            --auth-mode login
