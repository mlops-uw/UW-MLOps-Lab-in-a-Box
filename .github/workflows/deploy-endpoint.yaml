name: Deploy Model Endpoint

on:
  workflow_dispatch:

jobs:
  get-config:
    uses: Azure/mlops-templates/.github/workflows/read-yaml.yml@main
    with:
      file_name: config-infra-prod.yml

  deploy-endpoint:
    needs: get-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure ML extension
        run: az extension add -n ml -y

      - name: Register environment
        run: |
          az ml environment create \
            --file ML/environment.yaml \
            --resource-group "${{ needs.get-config.outputs.resource_group }}" \
            --workspace-name "${{ needs.get-config.outputs.aml_workspace }}"
        continue-on-error: true

      - name: Create endpoint (skip if exists)
        run: |
          az ml online-endpoint create \
            --file ML/endpoint.yaml \
            --resource-group "${{ needs.get-config.outputs.resource_group }}" \
            --workspace-name "${{ needs.get-config.outputs.aml_workspace }}" \
          || echo "Endpoint already exists, continuing..."

      - name: Delete existing deployment (if any)
        run: |
          az ml online-deployment delete \
            --name blue \
            --endpoint-name taxi-mlops-endpoint \
            --resource-group "${{ needs.get-config.outputs.resource_group }}" \
            --workspace-name "${{ needs.get-config.outputs.aml_workspace }}" \
            --yes \
          || echo "No existing deployment to delete, continuing..."

      - name: Create deployment
        run: |
          az ml online-deployment create \
            --file ML/deployment.yaml \
            --resource-group "${{ needs.get-config.outputs.resource_group }}" \
            --workspace-name "${{ needs.get-config.outputs.aml_workspace }}" \
            --all-traffic

      - name: Test endpoint
        run: |
          az ml online-endpoint invoke \
            --name taxi-mlops-endpoint \
            --request-file ML/sample-request.json \
            --resource-group "${{ needs.get-config.outputs.resource_group }}" \
            --workspace-name "${{ needs.get-config.outputs.aml_workspace }}"

      - name: Show endpoint details
        run: |
          az ml online-endpoint show \
            --name taxi-mlops-endpoint \
            --resource-group "${{ needs.get-config.outputs.resource_group }}" \
            --workspace-name "${{ needs.get-config.outputs.aml_workspace }}" \
            --query "{name: name, scoring_uri: scoring_uri, state: provisioning_state}" \
            -o table
