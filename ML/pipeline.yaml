$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline

display_name: NYC_Taxi_ML_Pipeline
description: Preprocess taxi data, then run supervised and unsupervised learning
experiment_name: nyc_taxi_ml_pipeline

settings:
  default_compute: azureml:capstone
  continue_on_step_failure: false

inputs:
  raw_data:
    type: uri_folder
    path: azureml://datastores/mlops_datastore/paths/taxidata/

jobs:
  preprocess_data:
    type: command
    display_name: Preprocess Taxi Data
    code: .
    command: >-
      python preprocess.py
      --data-path ${{inputs.data_path}}
      --output-dir ${{outputs.output_dir}}
    environment: azureml:taxi-ml-env:1
    inputs:
      data_path: ${{parent.inputs.raw_data}}
    outputs:
      output_dir:
        type: uri_folder

  supervised_learning:
    type: command
    display_name: Supervised Learning
    code: .
    command: >-
      python supervised_learning.py
      --data-path ${{inputs.data_path}}
      --output-dir ${{outputs.output_dir}}
      --alpha 1.0
    environment: azureml:taxi-ml-env:1
    inputs:
      data_path: ${{parent.jobs.preprocess_data.outputs.output_dir}}
    outputs:
      output_dir:
        type: uri_folder

  unsupervised_learning:
    type: command
    display_name: Unsupervised Learning
    code: .
    command: >-
      python unsupervised_learning.py
      --data-path ${{inputs.data_path}}
      --output-dir ${{outputs.output_dir}}
      --n-clusters 5
    environment: azureml:taxi-ml-env:1
    inputs:
      data_path: ${{parent.jobs.preprocess_data.outputs.output_dir}}
    outputs:
      output_dir:
        type: uri_folder