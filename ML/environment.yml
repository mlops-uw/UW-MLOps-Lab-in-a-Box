$schema: https://azuremlschemas.azureedge.net/latest/environment.schema.json
name: taxi-ml-env
version: 1
description: Environment for NYC Taxi ML pipeline

image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04

conda_file:
  name: taxi-ml-env
  channels:
    - conda-forge
  dependencies:
    - python=3.9
    - pip=23.0
    - pip:
        - pandas==2.0.3
        - numpy==1.24.3
        - scikit-learn==1.3.0
        - matplotlib==3.7.2
        - seaborn==0.12.2
        - pyarrow==12.0.1
        - azureml-mlflow==1.51.0
